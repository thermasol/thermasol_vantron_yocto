# TSCADC MFD + its IIO ADC child. The app reads the room-temperature
# thermistor from /sys/bus/iio/devices/iio:device0/in_voltage0_raw, which
# only exists once ti_am335x_adc has probed. Both are =m in the defconfig
# (CONFIG_MFD_TI_AM335X_TSCADC, CONFIG_TI_AM335X_ADC) and tscadc0 is
# status = "okay" with ti,adc-channels = <0 1> in vt-sbc-am62l.dtsi.
ti_am335x_tscadc
ti_am335x_adc
