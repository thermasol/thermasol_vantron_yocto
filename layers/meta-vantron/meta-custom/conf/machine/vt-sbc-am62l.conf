
require conf/machine/include/am62lxx.inc
require conf/machine/include/ti-extras.inc
require include/vt-am62l.inc

IMAGE_FSTYPES = "tar.xz ext4 ext4.gz wic"

# This board never boots via UEFI. U-Boot's own bootcmd does the work:
#
#   bootcmd   = run args_mmc; run loadimage; run loadfdt; run run_kern;
#   loadimage = load ${devtype} ${bootpart} ${loadaddr} ${bootdir}/${bootfile}
#   bootpart=0:2  bootdir=/boot  bootfile=Image
#
# i.e. it reads /boot/Image and /boot/dtb/ti/${fdtfile} straight off the
# ext4 root partition. k3.inc nevertheless adds "efi" to MACHINE_FEATURES,
# which makes packagegroup-core-boot RDEPEND on "${EFI_PROVIDER} kernel" and
# costs the rootfs:
#
#   grub-efi + grub-common        ~20 MB, plus /boot/EFI/BOOT/bootaa64.efi
#                                 and a grub.cfg nothing ever reads
#   kernel -> kernel-base         RRECOMMENDS kernel-image-${KERNEL_VERSION},
#                                 which RDEPENDS on kernel-image-fitimage:
#                                 a 16 MB /boot/fitImage that this bootcmd
#                                 never loads (the boot_fit path isn't
#                                 taken, IMAGE_BOOT_FILES doesn't include
#                                 it, and flash-tools only pushes emmc.wic
#                                 plus the loader blobs)
#
# Dropping the feature is safe for the files U-Boot actually needs, because
# both of them arrive through MACHINE_ESSENTIAL_EXTRA_RDEPENDS instead:
# k3.inc already lists kernel-image-image (/boot/Image) and poky's
# defaultsetup adds kernel-devicetree (/boot/dtb/**). Net ~36 MB.
#
# WKS_FILE's "efi" conditional in k3.inc is a ?= that the product image
# recipes already override with ${MACHINE}.wks.in, and the kernel here is
# linux-ti-staging, which doesn't include linux-yocto.inc - so nothing else
# on this board reads the feature.
MACHINE_FEATURES:remove = "efi"


KERNEL_DEVICETREE_PREFIX = " \
    ti/vt-sbc- \
"

KERNEL_DEVICETREE = "am62l.dtb"

UBOOT_MACHINE = "vt_sbc_am62l_defconfig"
PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-ti"



#############################################
