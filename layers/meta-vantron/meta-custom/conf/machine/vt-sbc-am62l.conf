IMAGE_VERSION ?= "1.0.6"
HW_VERSION ?= "1.0"
LINUX_VERSION = "6.12.24"
CUSTOM_APP ?= "xxxxx"
APP_VERSION ?= "xxxx"
FACTORY_IMAGE ?= "vtlinux-image-weston"
