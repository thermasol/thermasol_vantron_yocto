# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-custom-release"
BBFILE_PATTERN_meta-custom-release := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-custom-release = "6"
LAYERSERIES_COMPAT_meta-custom-release = "scarthgap"

# Absolute path of this layer, for recipes that run helper scripts out of
# ${META_CUSTOM_DIR}/scripts (image sparse conversion, boot0 assembly).
META_CUSTOM_DIR := "${LAYERDIR}"
