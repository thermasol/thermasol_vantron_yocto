# Zadig preset: Device > Load Preset Device... > this file.
# Installs WinUSB for the AM62L U-Boot USB gadget (DFU and fastboot share
# VID:PID 0451:6165) with the Android device interface GUID that Google
# fastboot.exe enumerates by. dfu-util.exe is indifferent to the GUID, so
# one binding serves both. Plug the board in (any stage), load this
# preset, driver target WinUSB, press Install/Replace Driver.
[device]
Description = "AM62L USB download gadget (DFU + fastboot)"
VID = 0x0451
PID = 0x6165
GUID = "{F72FE0D4-CBCB-407D-8814-9ED673D0DD6B}"
