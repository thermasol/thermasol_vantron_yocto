# ┌────────────────────────────────────────────────────────────────────────────────────────┐
# │                          ===== FLASH CONFIGURATION FILE =====                          │
# │ Points at vt-sbc-am62l-yocto's own build output (build/deploy-ti/images/vt-sbc-am62l/)  │
# │ via the symlinks in bin/loader/ and bin/images/ next to this file.                      │
# └────────────────────────────────────────────────────────────────────────────────────────┘

# R5F SPL @Raw flash to Boot0 hardware partition
--file="bin/loader/tiboot3.bin" --operation=flash-emmc --flash-offset=0x0 --attributes="raw,1,-"

# A53 SPL @Raw flash to Boot0 hardware partition
--file="bin/loader/tispl.bin" --operation=flash-emmc --flash-offset=0x80000 --attributes="raw,1,-"

# A53 U-Boot @Raw flash to Boot0 hardware partition
--file="bin/images/u-boot.img" --operation=flash-emmc --flash-offset=0x280000 --attributes="raw,1,-"

# Full disk image (bootloader env + rootfs partitions per the board's .wks layout)
--file="bin/images/emmc.wic" --operation=flash-emmc --flash-offset=0x0 --attributes="raw,0,-"
