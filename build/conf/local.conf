MACHINE = "vt-sbc-am62l"

DISTRO = "vtlinux"

#DL_DIR ?= "${TOPDIR}/downloads"
#SSTATE_DIR ?= "${TOPDIR}/sstate-cache"
#TMPDIR = "${TOPDIR}/tmp"

PACKAGE_CLASSES ?= "package_deb"

EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

USER_CLASSES ?= "buildstats"

PATCHRESOLVE = "noop"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

PACKAGECONFIG:append:pn-qemu-native = " sdl"
PACKAGECONFIG:append:pn-nativesdk-qemu = " sdl"

GLIBC_GENERATE_LOCALES = "en_GB.UTF-8 en_US.UTF-8"
IMAGE_LINGUAS ?= "en-gb"

INHERIT += "devshell"

RM_OLD_IMAGE = "1"

# Nice debug data
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"

# Clean up working directory after build
INHERIT += "rm_work"

LICENSE_FLAGS_ACCEPTED += "commercial"

# meta-qt6 and meta-qt5 both weakly-default QT_GIT with incompatible conventions
# (qt6 appends QT_GIT_PROJECT separately in SRC_URI, qt5 expects it baked into
# QT_GIT itself) and meta-qt6 wins the race since it's listed first in
# bblayers.conf, breaking every meta-qt5 fetch. Nothing currently builds against
# meta-qt6 (no image references its packagegroups), so pin QT_GIT to the qt5
# convention. Revisit if meta-qt6 recipes are ever wired into an image.
QT_GIT = "git://code.qt.io/qt"

# do_package intermittently hits a pseudo/tar race under WSL2 ("got *at() syscall
# for unknown directory") when many perform_packagecopy tasks hammer the shared
# pseudo server concurrently at full 20-thread parallelism. Throttling reduces
# the race frequency; revisit/remove if a pseudo version with the fix lands.
BB_NUMBER_THREADS = "8"
PARALLEL_MAKE = "-j 8"

# dpkg-deb's own internal tar invocation (building data.tar for the .deb) hits
# the same pseudo/tar race, deterministically on some recipes with large
# package trees (linux-libc-headers, libdrm, fontconfig). DPKG_BUILDCMD is a
# weak default in package_deb.bbclass, so point it at a wrapper that retries
# dpkg-deb a few times instead of patching poky itself.
DPKG_BUILDCMD = "/home/etanner/vt-sbc-am62l-yocto/build/scripts/dpkg-deb-retry-v2.sh"

# Separate issue from the pseudo/tar race above: GNU tar >= 1.35 emits PAX
# extended headers ('x' type) for deeply-nested paths (e.g. locale data under
# /usr/lib/locale/<locale>/), and this host's dpkg can't parse some of those
# header types, failing do_rootfs with "corrupted filesystem tarfile in
# package archive: unsupported PAX tar header type 'x'" for glibc's locale
# packages. Force classic GNU format (no PAX headers) globally via a tar
# wrapper ahead of hosttools in PATH.
PATH:prepend = "/home/etanner/vt-sbc-am62l-yocto/build/scripts:"
